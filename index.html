<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Global Cache IP ranges</title>
<style>
  :root {
    --bg: #0f1115; --fg: #e6e6e6; --muted: #8a8f98; --accent: #4f8cff;
    --border: #262a33; --code-bg: #171a21;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fff; --fg: #1c1f24; --muted: #5a616b; --accent: #1f5fdb;
      --border: #e3e6ea; --code-bg: #f4f6f8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--fg); }
  header { border-bottom: 1px solid var(--border); padding: 16px 24px;
           display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 60px); }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  aside { border-right: 1px solid var(--border); padding: 16px;
          max-height: calc(100vh - 60px); overflow-y: auto; }
  @media (max-width: 720px) {
    aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
  }
  .search { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
            background: var(--code-bg); color: var(--fg); font: inherit; margin-bottom: 12px; }
  .country-list { list-style: none; padding: 0; margin: 0; }
  .country-list li button { display: flex; width: 100%; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border: 1px solid transparent; border-radius: 6px; background: none;
    color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
  .country-list li button:hover { background: var(--code-bg); }
  .country-list li button.active { background: var(--code-bg); border-color: var(--accent); }
  .country-list .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  section.content { padding: 24px; overflow-y: auto; max-height: calc(100vh - 60px); }
  @media (max-width: 720px) { section.content { max-height: none; } }
  .placeholder { color: var(--muted); padding: 40px 0; text-align: center; }
  .country-head { display: flex; justify-content: space-between; align-items: baseline;
                  gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .country-head h2 { margin: 0; font-size: 20px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions a, .actions button { border: 1px solid var(--border); background: var(--code-bg);
    color: var(--fg); padding: 6px 10px; border-radius: 6px; font: inherit; font-size: 13px;
    cursor: pointer; text-decoration: none; }
  .actions a:hover, .actions button:hover { border-color: var(--accent); }
  pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
        padding: 12px 16px; margin: 0; overflow-x: auto;
        font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre; max-height: 60vh; }
  .error { color: #ff6b6b; background: rgba(255,107,107,.1);
           border: 1px solid rgba(255,107,107,.3); border-radius: 8px; padding: 12px 16px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
           background: var(--code-bg); border: 1px solid var(--accent); border-radius: 8px;
           padding: 8px 16px; font-size: 13px; opacity: 0; transition: opacity .2s;
           pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Google Global Cache IP ranges (AS15169)</h1>
  <span class="meta" id="meta">Loading…</span>
</header>
<main>
  <aside>
    <input class="search" id="search" type="search" placeholder="Filter countries…" autocomplete="off">
    <ul class="country-list" id="countries"></ul>
  </aside>
  <section class="content" id="content">
    <div class="placeholder">Select a country to view its prefixes.</div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";

const state = { index: null, active: null, cache: new Map() };

const el = {
  meta: document.getElementById("meta"),
  search: document.getElementById("search"),
  countries: document.getElementById("countries"),
  content: document.getElementById("content"),
  toast: document.getElementById("toast"),
};

function toast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.toast.classList.remove("show"), 1600);
}

async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied");
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Copied"); }
    catch { toast("Copy failed"); }
    finally { ta.remove(); }
  }
}

function fmtDate(iso) {
  try {
    return new Date(iso).toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
    });
  } catch { return iso; }
}

function renderMeta() {
  if (!state.index) return;
  const n = state.index.countries.length;
  el.meta.textContent =
    `${n} ${n === 1 ? "country" : "countries"} · updated ${fmtDate(state.index.generated_at)}`;
}

function renderCountries() {
  const filter = el.search.value.trim().toLowerCase();
  const items = state.index.countries.filter(c =>
    !filter || c.code.toLowerCase().includes(filter) || c.name.toLowerCase().includes(filter)
  );

  el.countries.replaceChildren(...items.map(c => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.dataset.code = c.code;
    if (state.active === c.code) btn.classList.add("active");

    const label = document.createElement("span");
    label.textContent = `${c.name} (${c.code})`;

    const count = document.createElement("span");
    count.className = "count";
    count.textContent = c.prefixes;

    btn.append(label, count);
    btn.addEventListener("click", () => select(c.code));
    li.append(btn);
    return li;
  }));

  if (items.length === 0) {
    const li = document.createElement("li");
    li.className = "placeholder";
    li.textContent = "No matches";
    el.countries.append(li);
  }
}

async function loadCountry(code) {
  if (state.cache.has(code)) return state.cache.get(code);
  const entry = state.index.countries.find(c => c.code === code);
  if (!entry) throw new Error(`Unknown country ${code}`);
  const res = await fetch(entry.file, { cache: "no-cache" });
  if (!res.ok) throw new Error(`HTTP ${res.status} for ${entry.file}`);
  const text = await res.text();
  const prefixes = text.split("\n").map(s => s.trim()).filter(Boolean);
  state.cache.set(code, prefixes);
  return prefixes;
}

async function select(code, opts = {}) {
  state.active = code;
  renderCountries();

  const entry = state.index.countries.find(c => c.code === code);
  if (!entry) return;

  if (!opts.skipUrl) {
    const url = new URL(location.href);
    url.searchParams.set("c", code.toLowerCase());
    history.pushState({ code }, "", url);
  }

  const head = document.createElement("div");
  head.className = "country-head";

  const title = document.createElement("h2");
  title.textContent = `${entry.name} · ${entry.code}`;

  const actions = document.createElement("div");
  actions.className = "actions";

  const dl = document.createElement("a");
  dl.href = entry.file; dl.textContent = "Download .txt";
  dl.setAttribute("download", "");

  const raw = document.createElement("a");
  raw.href = entry.file; raw.textContent = "Open raw ↗";
  raw.target = "_blank"; raw.rel = "noopener";

  const copyBtn = document.createElement("button");
  copyBtn.type = "button"; copyBtn.textContent = "Copy all";
  copyBtn.addEventListener("click", async () => {
    try { await copy((await loadCountry(code)).join("\n")); }
    catch (e) { toast(`Copy failed: ${e.message}`); }
  });

  actions.append(dl, raw, copyBtn);
  head.append(title, actions);

  const pre = document.createElement("pre");
  pre.textContent = "Loading…";

  el.content.replaceChildren(head, pre);

  try {
    const prefixes = await loadCountry(code);
    pre.textContent = prefixes.join("\n");
    title.textContent = `${entry.name} · ${entry.code} · ${prefixes.length} prefixes`;
  } catch (e) {
    pre.replaceWith(Object.assign(document.createElement("div"), {
      className: "error",
      textContent: `Failed to load ${entry.file}: ${e.message}`,
    }));
  }
}

window.addEventListener("popstate", () => {
  if (!state.index) return;
  const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
  if (code && state.index.countries.some(c => c.code === code)) {
    select(code, { skipUrl: true });
  } else {
    state.active = null;
    renderCountries();
    el.content.innerHTML = '<div class="placeholder">Select a country to view its prefixes.</div>';
  }
});

async function init() {
  try {
    const res = await fetch("index.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.index = await res.json();
  } catch (e) {
    el.meta.textContent = "Failed to load index.json";
    el.content.innerHTML =
      `<div class="error">Failed to load index.json: ${e.message}</div>`;
    return;
  }

  renderMeta();
  renderCountries();

  const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
  if (code && state.index.countries.some(c => c.code === code)) {
    select(code, { skipUrl: true });
  }
}

el.search.addEventListener("input", renderCountries);
init();
</script>
</body>
</html>
