name: Discover GGC IPs

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_countries: ${{ steps.matrix.outputs.has_countries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install maxminddb

      - name: Prepare binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p bin

          # naabu
          gh api repos/projectdiscovery/naabu/releases/latest --jq '.tag_name' | sed 's/^v//' | \
            xargs -I{} curl -sL "https://github.com/projectdiscovery/naabu/releases/latest/download/naabu_{}_linux_amd64.zip" -o /tmp/naabu.zip
          unzip -oq /tmp/naabu.zip -d bin naabu

          # tlsx
          gh api repos/projectdiscovery/tlsx/releases/latest --jq '.tag_name' | sed 's/^v//' | \
            xargs -I{} curl -sL "https://github.com/projectdiscovery/tlsx/releases/latest/download/tlsx_{}_linux_amd64.zip" -o /tmp/tlsx.zip
          unzip -oq /tmp/tlsx.zip -d bin tlsx

          # cidr-merger
          curl -sL "https://github.com/zhanhb/cidr-merger/releases/latest/download/cidr-merger-linux-amd64" -o bin/cidr-merger

          chmod +x bin/*
          rm -f /tmp/naabu.zip /tmp/tlsx.zip

      - name: Download IPInfo country-ASN database
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 \
            "https://ipinfo.io/data/free/country_asn.mmdb?token=${IPINFO_TOKEN}" \
            -o country_asn.mmdb
          python - <<'PY'
          import maxminddb
          with maxminddb.open_database('country_asn.mmdb') as r:
              print('MMDB metadata:', r.metadata())
          PY

      - name: Extract Google IPs by country
        env:
          TARGET_ASN: ${{ vars.TARGET_ASN }}
          TARGET_RANGES: ${{ vars.TARGET_RANGES }}
        run: python scripts/extract-ips-by-country.py --write --out-dir work

      - name: Build matrix
        id: matrix
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          work = Path("work")
          dirs = sorted(p.name for p in work.iterdir() if p.is_dir()) if work.is_dir() else []
          matrix = [{"dir": d, "code": d} for d in dirs]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_countries={'true' if matrix else 'false'}\n")
              f.write(f"matrix={json.dumps(matrix)}\n")

          print(f"Generated matrix ({len(matrix)} countries):")
          print(json.dumps(matrix, indent=2))
          if not matrix:
              print("::warning::extract-ips-by-country.py did not find any country")
          PY

      - name: Upload manifest
        if: steps.matrix.outputs.has_countries == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prepare-manifest
          path: work/_manifest.json
          retention-days: 1

      - name: Upload work dir
        if: steps.matrix.outputs.has_countries == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prepare-work
          path: |
            work/
          retention-days: 1

      - name: Upload bin dir
        if: steps.matrix.outputs.has_countries == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prepare-bin
          path: |
            bin/
          retention-days: 1

  scan:
    needs: prepare
    if: needs.prepare.outputs.has_countries == 'true'
    runs-on: ubuntu-latest
    name: 'Scan :: ${{ matrix.country.code }}'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10 # max 20
      matrix:
        country: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpcap-dev

      - name: Download prepare artifacts
        uses: actions/download-artifact@v7
        with:
          name: prepare-work
          path: work

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          name: prepare-bin
          path: bin

      - name: Install binaries
        run: |
          sudo mv bin/* /usr/local/bin/
          sudo chmod +x /usr/local/bin/naabu /usr/local/bin/tlsx /usr/local/bin/cidr-merger

      - name: Scan for GGC IPs
        env:
          CODE: ${{ matrix.country.code }}
          DIR: ${{ matrix.country.dir }}
          GGC_SNI: ${{ vars.GGC_SNI }}
          GGC_CN: ${{ vars.GGC_CN }}
        run: |
          set -euo pipefail
          in_file="work/${DIR}/${CODE}.txt"
          out_file="out/by-country/${CODE,,}.txt"
          if [[ ! -r "$in_file" ]]; then
            echo "::error::missing input $in_file"
            exit 1
          fi
          mkdir -p "$(dirname "$out_file")"
          if ! bash scripts/scan-ggc.sh -c 300 -r 4000 "$in_file" "$out_file"; then
            echo "::warning::scan-ggc.sh failed for ${CODE}"
          fi
          if [[ -s "$out_file" ]]; then
            echo "Produced ${out_file}: $(wc -l < "$out_file") lines"
          else
            echo "::warning::no GGC matches for ${CODE}"
          fi

      - name: Upload result
        if: hashFiles('out/by-country/*.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ggc-${{ matrix.country.code }}
          path: out/
          retention-days: 1
          if-no-files-found: ignore

  publish:
    needs: [ prepare, scan ]
    if: ${{ !cancelled() && needs.prepare.outputs.has_countries == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all GGC artifacts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: ggc-*
          path: out
          merge-multiple: true

      - name: Download manifest
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: prepare-manifest
          path: meta

      - name: Verify out/
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( out/by-country/*.txt )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::warning::no GGC files to publish"
          else
            echo "Publishing ${#files[@]} file(s):"
            printf '  %s\n' "${files[@]}"
          fi

      - name: Generate index.json
        if: hashFiles('out/by-country/*.txt') != ''
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path("out")
          country_dir = out / "by-country"
          manifest_path = Path("meta/_manifest.json")
          manifest = json.loads(manifest_path.read_text()) if manifest_path.exists() else {}

          countries = []
          for f in sorted(country_dir.glob("*.txt")):
              code = f.stem.upper()
              lines = [l for l in f.read_text().splitlines() if l.strip()]
              countries.append({
                  "code": code,
                  "name": manifest.get(code, {}).get("name", code),
                  "file": f"by-country/{f.name}",
                  "prefixes": len(lines),
              })

          index = {
              "generated_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "repository": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}",
              "description": "Google Global Cache IP ranges (AS15169) discovered via TLS 1.3 SNI scan.",
              "countries": countries,
          }
          (out / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2) + "\n"
          )
          print(f"index.json: {len(countries)} countries")
          PY

      - name: Copy viewer
        if: hashFiles('out/by-country/*.txt') != ''
        run: cp site/index.html out/index.html

      - name: Publish to gh-pages
        if: hashFiles('out/by-country/*.txt') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          commit_message: "Update IP lists (run ${{ github.run_id }})"
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
