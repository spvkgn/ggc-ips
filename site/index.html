<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Global Cache IP ranges</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<header>
  <h1>Google Global Cache IP ranges (AS15169)</h1>
  <span class="meta" id="meta">Loading…</span>
</header>
<main>
  <aside>
    <input class="search" id="search" type="search" placeholder="Filter countries…" aria-label="Filter countries" autocomplete="off">
    <ul class="country-list" id="countries"></ul>
  </aside>
  <section class="content" id="content">
    <div class="placeholder">Select a country to view its prefixes.</div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
